name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            shared/setup.py
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare public tokenizer vocabularies (no API key)
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/clauseiq-tokenizers
        run: |
          python -c "import tiktoken; [tiktoken.get_encoding(name) for name in ('o200k_base', 'cl100k_base')]; print('Tokenizer vocabularies ready')"
      - name: Run deterministic backend suite
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/clauseiq-tokenizers
        # Live storage and paid evaluation scripts are manual opt-ins, not pytest tests.
        run: python -m pytest tests -q

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json
      - name: Build shared types
        run: |
          npm --prefix shared ci
          npm --prefix shared run build
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run frontend unit and component tests
        run: npm --prefix frontend test
      - name: Typecheck
        run: npm --prefix frontend run typecheck
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Build production bundle
        # Build validation only: this workflow never starts or deploys production.
        run: npm --prefix frontend run build

  browser:
    name: Unpaid browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json
      - name: Build shared types and install frontend dependencies
        run: |
          npm --prefix shared ci
          npm --prefix shared run build
          npm --prefix frontend ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise synthetic browser journeys
        # The harness owns an isolated dev server and mocks API traffic; no backend,
        # database, saved credential, or paid provider is used.
        run: npm --prefix frontend run test:e2e
      - name: Retain synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          scanner_dir="$(mktemp -d "${RUNNER_TEMP}/clauseiq-gitleaks.XXXXXX")"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${scanner_dir}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${scanner_dir}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${scanner_dir}/${archive}" --directory "${scanner_dir}" gitleaks
          printf '%s\n' "${scanner_dir}" >> "$GITHUB_PATH"
      - name: Scan reachable Git history
        run: gitleaks git . --log-opts="--all" --redact --no-banner
