[tool.ruff]
target-version = "py313"
cache-dir = ".local-only/quality/ruff"
extend-exclude = ["venv", ".venv", ".local-only"]

[tool.ruff.lint]
# Start with parse errors, invalid comparisons and undefined names. Broader style
# rules can be adopted module by module without hiding the existing baseline.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
files = ["services/ai/review_passages.py", "services/ai/ask_citations.py", "middleware/request_context.py"]
mypy_path = "../shared"
strict = true
# Preserve dependency types while limiting diagnostics to the declared seed
# scope. This is incremental checking, not a claim that all backend code is typed.
follow_imports = "silent"
cache_dir = ".local-only/quality/mypy"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*", ".local-only/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage/backend.xml"
